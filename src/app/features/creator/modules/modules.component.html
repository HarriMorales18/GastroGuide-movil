<section class="modules-card">
  <h2>Modulo, crear lecciones</h2>

  <p class="alert" *ngIf="alertMessage" [ngClass]="'alert-' + alertType">
    {{ alertMessage }}
  </p>

  <div class="form-grid">
    <label class="field-group">
      <span>Titulo de leccion</span>
      <input
        type="text"
        [(ngModel)]="lessonTitle"
        placeholder="Escribe el titulo"
        maxlength="80"
      />
    </label>

    <label class="field-group">
      <span>Modulo</span>
      <select [(ngModel)]="selectedModule">
        <option value="" disabled>Seleccionar modulo</option>
        <option *ngFor="let module of modules" [value]="module.title">
          {{ module.title }}
        </option>
      </select>
    </label>
  </div>

  <button type="button" class="btn-secondary" (click)="addLesson()">
    Guardar Leccion
  </button>

  <hr />

  <h3>Crear videos en lecciones</h3>

  <div class="video-section">
    <div class="video-controls">
      <label class="field-group">
        <span>Lecciones</span>
        <select [(ngModel)]="selectedLesson">
          <option value="" disabled>Seleccionar leccion</option>
          <option *ngFor="let lesson of lessons" [value]="lesson.title">
            {{ lesson.title }}
          </option>
        </select>
      </label>

      <label class="upload-btn" for="videoInput">Cargar video</label>
      <input id="videoInput" type="file" accept="video/*" (change)="onVideoSelected($event)" />
    </div>

    <div class="preview-box">
      <p>Preview video</p>
      <video
        *ngIf="previewUrl"
        class="preview-player"
        [src]="previewUrl"
        controls
        preload="metadata"
        playsinline
      ></video>
      <small *ngIf="selectedVideoName">{{ selectedVideoName }}</small>
      <small *ngIf="!selectedVideoName">Sin video cargado</small>
    </div>
  </div>

  <hr />

  <div class="action-row">
    <button type="button" class="btn-secondary" (click)="saveDraftCourse()">
      Guardar Curso
    </button>
    <button type="button" class="btn-primary" (click)="publishCourse()">
      Publicar Curso
    </button>
  </div>
</section>
