<section class="config-shell">
  <ng-container *ngIf="!activeTab(); else fullscreenView">
    <header class="config-hero">
      <div class="hero-copy">
        <p class="hero-kicker">Creator Studio</p>
        <h2>Centro de configuracion</h2>
        <p>
          Gestiona seguridad, preferencias y pagos desde un entorno claro y ordenado.
        </p>
      </div>

      <button class="logout-btn" (click)="logout()" aria-label="Cerrar sesión">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Cerrar sesión</span>
      </button>
    </header>

    <section class="quick-info" aria-label="Resumen de configuracion">
      <article class="info-card">
        <strong>{{ configOptions.length }}</strong>
        <span>secciones de ajuste</span>
      </article>
      <article class="info-card">
        <strong>Segura</strong>
        <span>gestion de cuenta protegida</span>
      </article>
      <article class="info-card">
        <strong>Wallet</strong>
        <span>pagos e impuestos centralizados</span>
      </article>
    </section>

    <nav class="config-tabs" aria-label="Secciones de configuración">
      <button
        *ngFor="let option of configOptions"
        type="button"
        (click)="setActiveTab(option.id)"
        class="tab-btn"
        [class.active]="activeTab() === option.id"
      >
        <ion-icon [name]="option.icon"></ion-icon>
        <span class="tab-label">{{ option.label }}</span>
        <span class="tab-description">{{ option.description }}</span>
      </button>
    </nav>
  </ng-container>

  <ng-template #fullscreenView>
    <section class="config-fullscreen">
      <header class="fullscreen-topbar">
        <p class="topbar-title">Configuracion detallada</p>
        <button type="button" class="back-btn" (click)="backToSections()" aria-label="Volver a secciones">
          <ion-icon name="arrow-back-outline"></ion-icon>
          <span>Volver</span>
        </button>
      </header>

      <div class="fullscreen-body" [ngSwitch]="activeTab()">
        <app-account-config-view *ngSwitchCase="'account'"></app-account-config-view>
        <app-preferences-config-view *ngSwitchCase="'preferences'"></app-preferences-config-view>
        <app-payment-config-view *ngSwitchCase="'payment'"></app-payment-config-view>
      </div>
    </section>
  </ng-template>
</section>
