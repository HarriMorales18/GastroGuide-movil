<div class="creator-shell">
  <header class="top-area">
    <div class="top-actions-row">
      <h1 class="wordmark">GastroGuide</h1>
      <button
        class="profile-avatar-btn"
        type="button"
        [attr.aria-label]="'Ir al perfil de ' + loggedUserDisplayName()"
        (click)="setActiveTab('profile')"
      >
        <img
          [src]="loggedUserAvatarUrl() || defaultAvatarUrl"
          [alt]="'Foto de ' + loggedUserDisplayName()"
          loading="lazy"
          decoding="async"
        />
      </button>
    </div>

    <nav class="tabs-icons" aria-label="Navegacion creador">
      <button
        type="button"
        [class.active]="activeTab === 'create'"
        aria-label="Ir a crear curso"
        (click)="setActiveTab('create')"
      >
        <ion-icon name="add-circle-outline"></ion-icon>
      </button>

      <button
        type="button"
        [class.active]="activeTab === 'statistics'"
        aria-label="Ir a estadisticas"
        (click)="setActiveTab('statistics')"
      >
        <ion-icon name="stats-chart-outline"></ion-icon>
      </button>

      <button
        type="button"
        [class.active]="activeTab === 'profile'"
        aria-label="Ir a perfil"
        (click)="setActiveTab('profile')"
      >
        <ion-icon name="person-circle-outline"></ion-icon>
      </button>

      <button
        type="button"
        [class.active]="activeTab === 'config'"
        aria-label="Ir a configuracion"
        (click)="setActiveTab('config')"
      >
        <ion-icon name="menu-outline"></ion-icon>
      </button>
    </nav>
  </header>

  <main class="content">
    <app-create-course *ngIf="activeTab === 'create'"></app-create-course>
    <app-statistics *ngIf="activeTab === 'statistics'"></app-statistics>
    <app-profile *ngIf="activeTab === 'profile'"></app-profile>
    <app-creator-config *ngIf="activeTab === 'config'"></app-creator-config>
  </main>
</div>
