<div class="create-course-view">
  <section class="studio-shell">
    <header class="studio-header">
      <p class="kicker">Creator Studio</p>
      <h1>Crear nuevo curso</h1>
      <p>
        Completa la informacion basica para guardar el curso como borrador y continuar su edicion en
        la pestaña Content.
      </p>
    </header>

    <p class="alert" *ngIf="alertMessage" [ngClass]="'alert-' + alertType">
      {{ alertMessage }}
    </p>

    <form class="course-form" (ngSubmit)="createDraftCourse()" novalidate>
      <div class="form-card">
        <h2>Informacion basica del curso</h2>

        <div class="form-grid">
          <label class="field field-full">
            <span>Titulo del curso *</span>
            <input
              type="text"
              name="courseTitle"
              [(ngModel)]="courseTitle"
              [class.invalid]="hasError('title')"
              placeholder="Ej: Tecnicas avanzadas de cocina mediterranea"
              minlength="2"
              maxlength="100"
            />
            <small class="error" *ngIf="hasError('title')">
              {{ courseTitle.trim().length > 0 && courseTitle.trim().length < 2 ? 'El titulo debe tener al menos 2 caracteres.' : 'El titulo es obligatorio.' }}
            </small>
          </label>

          <label class="field field-full">
            <span>Descripcion detallada *</span>
            <textarea
              name="courseDescription"
              [(ngModel)]="courseDescription"
              [class.invalid]="hasError('description')"
              rows="5"
              minlength="10"
              maxlength="500"
              placeholder="Describe objetivos, tecnicas y resultados de aprendizaje del curso."
            ></textarea>
            <small class="error" *ngIf="hasError('description')">
              {{ courseDescription.trim().length > 0 && courseDescription.trim().length < 10 ? 'La descripcion debe tener al menos 10 caracteres.' : 'La descripcion es obligatoria.' }}
            </small>
          </label>

          <label class="field">
            <span>Categoria gastronomica *</span>
            <select
              name="selectedCategory"
              [(ngModel)]="selectedCategory"
              [class.invalid]="hasError('category')"
            >
              <option value="">Seleccionar categoria</option>
              <option *ngFor="let category of categoryOptions" [value]="category.apiValue">
                {{ category.label }}
              </option>
            </select>
            <small class="error" *ngIf="hasError('category')">Selecciona una categoria.</small>
          </label>

          <label class="field">
            <span>Tipo de cocina *</span>
            <select
              name="selectedCuisineType"
              [(ngModel)]="selectedCuisineType"
              [class.invalid]="hasError('cuisineType')"
            >
              <option value="">Seleccionar tipo</option>
              <option *ngFor="let cuisineType of cuisineTypeOptions" [value]="cuisineType.value">
                {{ cuisineType.label }}
              </option>
            </select>
            <small class="error" *ngIf="hasError('cuisineType')">Selecciona el tipo de cocina.</small>
          </label>

          <label class="field">
            <span>Nivel de dificultad *</span>
            <select
              name="selectedDifficulty"
              [(ngModel)]="selectedDifficulty"
              [class.invalid]="hasError('difficulty')"
            >
              <option value="">Seleccionar nivel</option>
              <option *ngFor="let difficulty of difficulties" [value]="difficulty">
                {{ difficulty | titlecase }}
              </option>
            </select>
            <small class="error" *ngIf="hasError('difficulty')">Selecciona el nivel del curso.</small>
          </label>

          <label class="field field-full">
            <span>Imagen de portada o miniatura *</span>
            <input
              type="file"
              accept="image/*"
              (change)="onCoverSelected($event)"
              [class.invalid]="hasError('coverImage')"
            />
            <small class="file-name" *ngIf="coverImageName">Archivo: {{ coverImageName }}</small>
            <small class="error" *ngIf="hasError('coverImage')">Debes subir una imagen de portada.</small>

            <div class="cover-preview" *ngIf="coverImageDataUrl">
              <img [src]="coverImageDataUrl" alt="Vista previa de portada" loading="lazy" decoding="async" />
            </div>
          </label>
        </div>
      </div>

      <footer class="action-bar">
        <button type="submit" class="btn-primary" [disabled]="creatingCourse">
          {{ creatingCourse ? 'Creando curso en backend...' : 'Crear curso en borrador' }}
        </button>
      </footer>
    </form>
  </section>
</div>
