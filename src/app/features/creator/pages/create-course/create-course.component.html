<div class="create-course-view">
  <main class="content-wrap">
    <section class="course-card" *ngIf="currentStep === 'course'">
      <h2>Crear Curso</h2>

      <p class="alert" *ngIf="alertMessage" [ngClass]="'alert-' + alertType">
        {{ alertMessage }}
      </p>

      <div class="form-grid">
        <label class="field-group">
          <span>Titulo</span>
          <input
            type="text"
            [(ngModel)]="courseTitle"
            placeholder="Escribe el titulo"
            maxlength="80"
          />
        </label>

        <label class="field-group">
          <span>Descripcion</span>
          <input
            type="text"
            [(ngModel)]="courseDescription"
            placeholder="Descripcion corta"
            maxlength="140"
          />
        </label>
      </div>

      <label class="field-group category">
        <span>Categoria</span>
        <select [(ngModel)]="selectedCategory">
          <option value="" disabled>Seleccionar</option>
          <option *ngFor="let category of categories" [value]="category">
            {{ category }}
          </option>
        </select>
      </label>

      <hr />

      <div class="form-grid">
        <label class="field-group">
          <span>Titulo modulo</span>
          <input
            type="text"
            [(ngModel)]="moduleTitle"
            placeholder="Ej: Introduccion"
            maxlength="80"
          />
        </label>

        <label class="field-group">
          <span>Descripcion</span>
          <input
            type="text"
            [(ngModel)]="moduleDescription"
            placeholder="Que aprenderan"
            maxlength="140"
          />
        </label>
      </div>

      <button type="button" class="btn-secondary" (click)="addModule()">
        Guardar Modulo
      </button>

      <div class="modules-list" *ngIf="modules.length > 0">
        <h3>Modulos agregados</h3>

        <article class="module-item" *ngFor="let module of modules; let i = index">
          <div>
            <strong>{{ module.title }}</strong>
            <p>{{ module.description }}</p>
          </div>

          <button type="button" class="remove-btn" (click)="removeModule(i)">
            Quitar
          </button>
        </article>
      </div>

      <hr />

      <button type="button" class="btn-primary" (click)="nextStep()">
        Siguiente
      </button>
    </section>

    <app-modules
      *ngIf="currentStep === 'lessons'"
      [modules]="modules"
      [courseTitle]="courseTitle"
    ></app-modules>
  </main>
</div>
