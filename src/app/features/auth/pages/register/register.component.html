<main class="register-view">
  <section class="register-card">
    <h2>Crear cuenta</h2>

    <div class="mode-switch">
      <button
        type="button"
        [class.active]="mode === 'student'"
        (click)="selectMode('student')"
      >
        Estudiante
      </button>
      <button
        type="button"
        [class.active]="mode === 'creator'"
        (click)="selectMode('creator')"
      >
        Creador
      </button>
    </div>

    <form (ngSubmit)="register()" class="register-form">
      <input
        *ngIf="mode === 'student'"
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Usuario"
        required
      />

      <input
        *ngIf="mode === 'creator'"
        type="text"
        name="firstName"
        [(ngModel)]="firstName"
        placeholder="Nombre"
        required
      />

      <input
        *ngIf="mode === 'creator'"
        type="text"
        name="lastName"
        [(ngModel)]="lastName"
        placeholder="Apellido"
        required
      />

      <input
        *ngIf="mode === 'creator'"
        type="text"
        name="identificationNumber"
        [(ngModel)]="identificationNumber"
        placeholder="Numero de identificacion"
        required
      />

      <select
        *ngIf="mode === 'creator'"
        name="identificationType"
        [(ngModel)]="identificationType"
        required
      >
        <option *ngFor="let option of identificationTypeOptions" [value]="option">
          {{ option }}
        </option>
      </select>

      <input
        *ngIf="mode === 'creator'"
        type="text"
        name="nationality"
        [(ngModel)]="nationality"
        placeholder="Nacionalidad"
        required
      />

      <input
        *ngIf="mode === 'creator'"
        type="file"
        name="avatarFile"
        accept="image/*"
        (change)="onAvatarSelected($event)"
        required
      />

      <small *ngIf="mode === 'creator' && avatarFileName" class="file-name">
        Imagen seleccionada: {{ avatarFileName }}
      </small>

      <input
        *ngIf="mode === 'creator'"
        type="tel"
        name="phoneNumber"
        [(ngModel)]="phoneNumber"
        placeholder="Telefono"
        required
      />

      <input
        *ngIf="mode === 'creator'"
        type="date"
        name="birthDate"
        [(ngModel)]="birthDate"
        required
      />

      <textarea
        *ngIf="mode === 'creator'"
        name="specialization"
        [(ngModel)]="specialization"
        placeholder="Especializacion"
        rows="3"
        required
      ></textarea>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        required
      />

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Contrasena"
        required
      />

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarme' }}
      </button>
    </form>

    <p *ngIf="error" class="error">{{ error }}</p>
    <p *ngIf="success" class="success">{{ success }}</p>

    <a routerLink="/">Ya tengo cuenta</a>
  </section>
</main>
