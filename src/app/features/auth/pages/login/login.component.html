<main class="login-view">
  <section class="login-card">
    <h2>GastroGuide</h2>

    <form class="login-form" autocomplete="off" (ngSubmit)="login()">
      <input type="email" name="email" autocomplete="username" [(ngModel)]="email" placeholder="Correo" />
      <input type="password" name="password" autocomplete="new-password" [(ngModel)]="password" placeholder="Contrasena" />

      <button type="submit">Iniciar sesion</button>
      <a class="forgot-link" routerLink="/forgot-password">Olvidaste tu contraseña?</a>
    </form>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <div class="social-auth">
      <button type="button" class="social-btn">Continuar con Google</button>
      <button type="button" class="social-btn">Continuar con Facebook</button>
    </div>

    <a class="create-account" routerLink="/register">Crear cuenta</a>
  </section>
</main>
