<main class="forgot-view">
  <section class="forgot-card">
    <h2>Recuperar contrasena</h2>
    <p class="subtitle">Ingresa tu correo para enviarte el enlace de recuperacion.</p>

    <form class="forgot-form" autocomplete="off" (ngSubmit)="requestRecovery()">
      <input
        type="email"
        name="email"
        autocomplete="email"
        [(ngModel)]="email"
        placeholder="Correo"
        required
      />

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </form>

    <p *ngIf="error" class="error">{{ error }}</p>
    <p *ngIf="success" class="success">{{ success }}</p>

    <a routerLink="/">Volver a iniciar sesion</a>
  </section>
</main>
